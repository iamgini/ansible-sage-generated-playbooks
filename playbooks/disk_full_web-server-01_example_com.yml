---
- name: Remediate disk space issues on web server
  hosts: web-server-01.example.com
  become: yes
  vars:
    target_mount: "/"
    cleanup_threshold: 80
    max_log_age_days: 30
    max_tmp_age_days: 7
    notification_target: "admin@example.com"

  tasks:
    - name: Check current disk usage on root mount
      ansible.builtin.shell: df {{ target_mount }} | tail -n 1 | awk '{print $5}' | sed 's/%//'
      register: disk_usage_initial
      changed_when: false

    - name: Verify disk usage exceeds cleanup threshold
      ansible.builtin.assert:
        that:
          - disk_usage_initial.stdout | int >= cleanup_threshold
        fail_msg: "Disk usage is {{ disk_usage_initial.stdout }}%, which is below the {{ cleanup_threshold }}% threshold. No cleanup required."
        success_msg: "Disk usage is {{ disk_usage_initial.stdout }}%, proceeding with cleanup."

    - name: Identify large files and directories in system paths
      ansible.builtin.shell: |
        echo "=== Large files in /var/log ==="
        find /var/log -type f -size +10M -exec ls -lh {} \;
        echo "=== Large directories in /tmp and /var/tmp ==="
        du -sh /tmp/* /var/tmp/* 2>/dev/null | sort -rh | head -10
        echo "=== Package cache size ==="
        du -sh /var/cache/apt/archives 2>/dev/null || du -sh /var/cache/yum 2>/dev/null || du -sh /var/cache/dnf 2>/dev/null
      register: large_files_report
      changed_when: false

    - name: Rotate system logs
      ansible.builtin.command: logrotate -f /etc/logrotate.conf
      changed_when: false
      failed_when: false

    - name: Remove old log files beyond retention period
      ansible.builtin.shell: find /var/log -type f -name "*.gz" -mtime +{{ max_log_age_days }} -delete
      changed_when: false
      failed_when: false
      check_mode: no

    - name: Clean package manager cache
      ansible.builtin.shell: |
        {%- if ansible_pkg_mgr == 'apt' -%} apt clean
        {%- elif ansible_pkg_mgr == 'dnf' -%} dnf clean all
        {%- elif ansible_pkg_mgr == 'yum' -%} yum clean all
        {%- elif ansible_pkg_mgr == 'zypper' -%} zypper clean -a
        {%- else -%} echo "Unsupported package manager: {{ ansible_pkg_mgr }}"
        {%- endif -%}
      changed_when: false
      failed_when: false
      check_mode: no

    - name: Remove temporary files older than retention period
      ansible.builtin.shell: