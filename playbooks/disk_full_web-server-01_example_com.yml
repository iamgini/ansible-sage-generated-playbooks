---
- name: Remediate disk space issues on web server
  hosts: web-server-01.example.com
  become: yes
  gather_facts: yes
  vars:
    disk_usage_threshold: 80
    mount_point: /
    notification_log: /var/log/disk_cleanup_notification.log
    cleanup_marker: /tmp/.disk_cleanup_marker

  tasks:
    - name: Check current disk usage
      ansible.builtin.shell: df {{ mount_point }} | awk 'NR==2 {print $5}' | sed 's/%//'
      register: current_disk_usage
      changed_when: false

    - name: Skip cleanup if disk usage is below threshold
      ansible.builtin.debug:
        msg: "Disk usage at {{ current_disk_usage.stdout }}% is below threshold. Skipping cleanup."
      when: current_disk_usage.stdout | int < disk_usage_threshold

    - name: Identify large directories consuming space
      ansible.builtin.shell: du -sh /var/log /var/cache /tmp 2>/dev/null || echo "Unable to determine large directories"
      register: large_dirs_info
      changed_when: false

    - name: Perform safe disk cleanup
      block:
        - name: Clean package manager cache
          ansible.builtin.command: "{{ ansible_pkg_mgr == 'apt' | ternary('apt clean', 'yum clean all') }}"
          register: cache_clean_result
          changed_when: cache_clean_result.rc == 0
          failed_when: cache_clean_result.rc != 0

        - name: Remove old compressed log files
          ansible.builtin.command: find /var/log -type f -name "*.gz" -mtime +30 -delete
          register: log_cleanup_result
          changed_when: log_cleanup_result.rc == 0
          failed_when: log_cleanup_result.rc != 0

        - name: Clean temporary files older than 7 days
          ansible.builtin.command: find /tmp -type f -mtime +7 -delete
          register: tmp_cleanup_result
          changed_when: tmp_cleanup_result.rc == 0
          failed_when: tmp_cleanup_result.rc != 0

        - name: Create cleanup marker for idempotency
          ansible.builtin.file:
            path: "{{ cleanup_marker }}"
            state: touch
            mode: '0644'
      when: current_disk_usage.stdout | int >= disk_usage_threshold
      rescue:
        - name: Handle cleanup failure
          ansible.builtin.debug:
            msg: "Disk cleanup encountered an error. Review logs and verify system state."

    - name: Send cleanup notification
      ansible.builtin.copy:
        content: "{{ ansible_date_time.iso8601 }} - Disk cleanup completed. Previous usage: {{ current_disk_usage.stdout }}%. Cleanup performed on /var/log, /var/cache, /tmp.\n"
        dest: "{{ notification_log }}"
        mode: '0644'
        owner: root
        group: root
        append: yes

    - name: Verify disk usage after cleanup
      ansible.builtin.shell: df {{ mount_point }} | awk 'NR==2 {print $5}' | sed 's/%//'
      register: post_cleanup_disk_usage
      changed_when: false

    - name: Assert disk usage has improved
      ansible.builtin.assert:
        that:
          - post_cleanup_disk_usage.stdout | int < current_disk_usage.stdout | int
        fail_msg: "Disk usage did not improve after cleanup. Current: {{ post_cleanup_disk_usage.stdout }}%"
        success_msg: "Disk usage improved from {{ current_disk_usage.stdout }}% to {{ post_cleanup_disk_usage.stdout }}%"