---
- name: Remediate disk space issues on web server
  hosts: web-server-01.example.com
  become: yes
  vars:
    disk_usage_threshold: 80
    max_log_age_days: 30
    max_tmp_age_days: 7
    notification_email: admin@example.com
    notification_subject: "Disk Cleanup Report - {{ inventory_hostname }}"

  tasks:
    - name: Check current disk usage
      ansible.builtin.shell: df -h / | awk 'NR==2{print $5}' | sed 's/%//'
      register: initial_disk_usage
      changed_when: false

    - name: Verify disk usage exceeds threshold
      ansible.builtin.assert:
        that:
          - initial_disk_usage.stdout | int >= disk_usage_threshold
        fail_msg: "Disk usage is {{ initial_disk_usage.stdout }}%. Below threshold of {{ disk_usage_threshold }}%. Aborting cleanup."
        success_msg: "Disk usage is {{ initial_disk_usage.stdout }}%. Proceeding with cleanup."

    - name: Identify large files and directories
      ansible.builtin.shell: |
        echo "=== Large files and directories ==="
        du -sh /var/log /tmp /var/cache /var/tmp 2>/dev/null || echo "Some directories not found"
      register: large_files_report
      changed_when: false

    - name: Display large files report
      ansible.builtin.debug:
        var: large_files_report.stdout_lines

    - name: Rotate system logs
      ansible.builtin.command: logrotate -f /etc/logrotate.conf
      register: logrotate_result
      changed_when: logrotate_result.rc == 0
      failed_when: logrotate_result.rc != 0

    - name: Clean package manager cache
      ansible.builtin.shell: |
        if command -v apt-get &> /dev/null; then
          apt-get clean
        elif command -v yum &> /dev/null; then
          yum clean all
        elif command -v dnf &> /dev/null; then
          dnf clean all
        fi
      register: pkg_cache_clean
      changed_when: pkg_cache_clean.rc == 0
      failed_when: pkg_cache_clean.rc != 0

    - name: Remove old temporary files
      ansible.builtin.find:
        paths:
          - /tmp
          - /var/tmp
        age: "{{ max_tmp_age_days }}d"
        state: absent
      register: tmp_cleanup
      changed_when: tmp_cleanup.changed

    - name: Remove old log files
      ansible.builtin.find:
        paths:
          - /var/log
        age: "{{ max_log_age_days }}d"
        patterns:
          - "*.log"
          - "*.gz"
          - "*.bz2"
          - "*.xz"
        state: absent
      register: log_cleanup
      changed_when: log_cleanup.changed

    - name: Verify disk usage improvement
      ansible.builtin.shell: df -h / | awk 'NR==2{print $5}' | sed 's/%//'
      register: final_disk_usage
      changed_when: false

    - name: Assert disk usage has improved
      ansible.builtin.assert:
        that:
          - final_disk_usage.stdout | int < initial_disk_usage.stdout | int
        fail_msg: "Disk usage did not improve. Initial: {{ initial_disk_usage.stdout }}%, Final: {{ final_disk_usage.stdout }}%"
        success_msg: "Disk usage improved from {{ initial_disk_usage.stdout }}% to {{ final_disk_usage.stdout }}%"

    - name: Send cleanup notification
      ansible.builtin.debug:
        msg: |
          Disk cleanup completed successfully.
          Initial usage: {{ initial_disk_usage.stdout }}%
          Final usage: {{ final_disk_usage.stdout }}%
          Freed space in: /var/log, /tmp, /var/cache, /var/tmp
          Threshold check: Passed (>= {{ disk_usage_threshold }}%)
      changed_when: false