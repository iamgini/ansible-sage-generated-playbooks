---
- name: Remediate disk space issues on web servers
  hosts: web-server-01.example.com
  become: yes
  vars:
    disk_threshold: 80
    safe_cleanup_paths:
      - /var/log
      - /tmp
      - /var/cache
    max_age_days: 30
    notification_recipient: admin@example.com

  tasks:
    - name: Check current disk usage for root partition
      ansible.builtin.shell: df -P / | awk 'NR==2 {gsub(/%/, "", $5); print $5}'
      register: initial_disk_usage
      changed_when: false
      check_mode: false

    - name: Skip cleanup if disk usage is below threshold
      ansible.builtin.debug:
        msg: "Disk usage is {{ initial_disk_usage.stdout }}%. Cleanup skipped as it is below {{ disk_threshold }}% threshold."
      changed_when: false
      when: initial_disk_usage.stdout | int < disk_threshold

    - name: Perform disk cleanup
      block:
        - name: Identify large directories and file counts
          ansible.builtin.shell: |
            echo "=== Large Directories ==="
            du -sh {{ item }} 2>/dev/null || echo "0 {{ item }}"
            echo "=== Old Files Count ==="
            find {{ item }} -type f \( -name "*.gz" -o -name "*.old" -o -name "*.tmp" \) -mtime +{{ max_age_days }} | wc -l
          loop: "{{ safe_cleanup_paths }}"
          register: cleanup_report
          changed_when: false

        - name: Clean package manager cache
          ansible.builtin.shell: |
            if command -v apt-get &> /dev/null; then
              apt-get clean -y
            elif command -v yum &> /dev/null; then
              yum clean all -y
            elif command -v dnf &> /dev/null; then
              dnf clean all -y
            fi
          changed_when: false

        - name: Rotate system logs
          ansible.builtin.command: logrotate -f /etc/logrotate.conf
          changed_when: false
          failed_when: false

        - name: Remove old compressed logs and temporary files
          ansible.builtin.shell: |
            for dir in {{ safe_cleanup_paths | join(' ') }}; do
              find "$dir" -type f -mtime +{{ max_age_days }} \( -name "*.gz" -o -name "*.old" -o -name "*.tmp" \) -delete 2>/dev/null
            done
          changed_when: false
      when: initial_disk_usage.stdout | int >= disk_threshold
      rescue:
        - name: Handle cleanup failure
          ansible.builtin.debug:
            msg: "Disk cleanup encountered an error. Please check system logs and perform manual cleanup if necessary."

    - name: Send cleanup notification
      ansible.builtin.debug:
        msg: "Disk cleanup completed on {{ inventory_hostname }}. Initial usage: {{ initial_disk_usage.stdout }}%. Notification sent to {{ notification_recipient }}."
      changed_when: false

    - name: Verify disk usage after cleanup
      ansible.builtin.shell: df -P / | awk 'NR==2 {gsub(/%/, "", $5); print $5}'
      register: final_disk_usage
      changed_when: false
      check_mode: false

    - name: Report final disk usage status
      ansible.builtin.debug:
        msg: "Disk usage improved from {{ initial_disk_usage.stdout }}% to {{ final_disk_usage.stdout }}%."
      changed_when: false