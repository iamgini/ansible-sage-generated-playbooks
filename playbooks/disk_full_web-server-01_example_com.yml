---
- name: Remediate disk space issues on web server
  hosts: web-server-01.example.com
  become: yes
  vars:
    disk_usage_threshold: 80
    log_retention_days: 30
    tmp_retention_days: 7
    notification_url: "https://hooks.example.com/alerts"
    notification_channel: "ops-alerts"

  tasks:
    - name: Check current disk usage on root partition
      ansible.builtin.shell: df / | tail -n 1 | awk '{print $5}' | sed 's/%//'
      register: disk_usage_raw
      changed_when: false
      check_mode: no

    - name: Parse disk usage percentage
      ansible.builtin.set_fact:
        current_disk_usage: "{{ disk_usage_raw.stdout | int }}"

    - name: Verify disk usage exceeds threshold
      ansible.builtin.assert:
        that:
          - current_disk_usage >= disk_usage_threshold
        fail_msg: "Disk usage is {{ current_disk_usage }}%, which is below the {{ disk_usage_threshold }}% threshold. Aborting cleanup."
        success_msg: "Disk usage is {{ current_disk_usage }}%, proceeding with cleanup."

    - name: Identify large files and directories
      ansible.builtin.shell: |
        echo "=== Top 10 largest directories ==="
        du -h --max-depth=1 /var /tmp /var/cache 2>/dev/null | sort -rh | head -n 10
        echo "=== Large files (>100M) in /var/log and /tmp ==="
        find /var/log /tmp -type f -size +100M -exec ls -lh {} \; 2>/dev/null
      register: large_files_report
      changed_when: false

    - name: Display large files report
      ansible.builtin.debug:
        var: large_files_report.stdout_lines

    - name: Clean package manager cache
      ansible.builtin.command: "{{ item }}"
      loop:
        - apt clean
        - yum clean all
        - dnf clean all
      changed_when: false
      failed_when: false
      when: ansible_pkg_mgr is defined and ansible_pkg_mgr in ['apt', 'yum', 'dnf']

    - name: Remove temporary files older than retention period
      ansible.builtin.command: find /tmp -type f -atime +{{ tmp_retention_days }} -delete
      changed_when: false
      failed_when: false

    - name: Rotate and truncate old log files
      ansible.builtin.command: find /var/log -name "*.log" -mtime +{{ log_retention_days }} -exec truncate -s 0 {} +
      changed_when: false
      failed_when: false

    - name: Verify disk usage after cleanup
      ansible.builtin.shell: df / | tail -n 1 | awk