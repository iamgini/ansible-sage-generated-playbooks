

---
- name: Remediate slow database queries on PostgreSQL
  hosts: db-cluster-03.example.com
  become: true
  tags:
    - database
    - performance
    - production
  tasks:
    - name: Block for PostgreSQL slow query remediation
      block:
        - name: Update PostgreSQL configuration to log queries exceeding 5 seconds
          ansible.builtin.lineinfile:
            path: /etc/postgresql/14/main/postgresql.conf
            regexp: '^#?\s*log_min_duration_statement'
            line: 'log_min_duration_statement = 5000'
            state: present
            backup: true
          register: pg_config_update

        - name: Update PostgreSQL statement timeout to 5 seconds
          ansible.builtin.lineinfile:
            path: /etc/postgresql/14/main/postgresql.conf
            regexp: '^#?\s*statement_timeout'
            line: 'statement_timeout = 5000'
            state: present
            backup: true
          register: pg_timeout_update

        - name: Reload PostgreSQL service to apply configuration changes
          ansible.builtin.service:
            name: postgresql
            state: reloaded
          when: pg_config_update is changed or pg_timeout_update is changed
          register: pg_reload_result

        - name: Verify PostgreSQL service is active after reload
          ansible.builtin.service:
            name: postgresql
            state: started
          register: pg_status_check

      rescue:
        - name: Log remediation failure and prepare for fallback
          ansible.builtin.debug:
            msg: "Configuration update or reload failed. Initiating fallback procedure."

        - name: Attempt PostgreSQL service restart as fallback
          ansible.builtin.service:
            name: postgresql
            state: restarted
          register: pg_restart_result

        - name: Fail playbook if fallback restart fails
          ansible.builtin.fail:
            msg: "PostgreSQL service restart failed. Manual intervention required."
          when: pg_restart_result is failed