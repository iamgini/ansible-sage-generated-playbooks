

---
- name: Remediate slow database queries on PostgreSQL
  hosts: db-cluster-03.example.com
  become: true
  tags:
    - database
    - performance
    - production
  tasks:
    - name: Update PostgreSQL configuration to address slow queries
      block:
        - name: Configure log_min_duration_statement to capture queries over 5 seconds
          ansible.builtin.lineinfile:
            path: /etc/postgresql/14/main/postgresql.conf
            regexp: '^#?\s*log_min_duration_statement\s*='
            line: 'log_min_duration_statement = 5000'
            state: present
            backup: true

        - name: Configure statement_timeout to limit long-running queries
          ansible.builtin.lineinfile:
            path: /etc/postgresql/14/main/postgresql.conf
            regexp: '^#?\s*statement_timeout\s*='
            line: 'statement_timeout = 10000'
            state: present
            backup: true

        - name: Reload PostgreSQL service to apply configuration changes
          ansible.builtin.systemd:
            name: postgresql
            state: reloaded
      rescue:
        - name: Handle configuration or service reload failure
          ansible.builtin.debug:
            msg: "Remediation failed. PostgreSQL configuration update or service reload encountered an error. Please verify configuration syntax and apply changes manually."