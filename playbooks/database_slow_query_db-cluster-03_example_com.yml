

---
- name: Remediate slow database queries on PostgreSQL
  hosts: db-cluster-03.example.com
  become: true
  tags:
    - database
    - performance
    - production
  tasks:
    - name: Update PostgreSQL configuration for slow query remediation
      block:
        - name: Set slow query logging threshold to 5 seconds
          ansible.builtin.lineinfile:
            path: /etc/postgresql/14/main/postgresql.conf
            regexp: '^#?\s*log_min_duration_statement\s*='
            line: 'log_min_duration_statement = 5000'
            state: present
            backup: true
          register: slow_query_config

        - name: Set statement timeout to 30 seconds to prevent long-running queries
          ansible.builtin.lineinfile:
            path: /etc/postgresql/14/main/postgresql.conf
            regexp: '^#?\s*statement_timeout\s*='
            line: 'statement_timeout = 30000'
            state: present
            backup: true
          register: statement_timeout_config

        - name: Reload PostgreSQL service to apply configuration changes
          ansible.builtin.service:
            name: postgresql
            state: reloaded
          when: slow_query_config.changed or statement_timeout_config.changed
          register: postgresql_reload
      rescue:
        - name: Handle configuration or service reload failure
          ansible.builtin.debug:
            msg: "Remediation failed during PostgreSQL configuration or service reload. Manual review required."
          ansible.builtin.fail:
            msg: "PostgreSQL slow query remediation encountered an error. Check system logs on db-cluster-03.example.com."
      always:
        - name: Log remediation completion status
          ansible.builtin.debug:
            msg: "Slow query remediation process completed for db-cluster-03.example.com."